<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>劳动法B 后期试题｜在线互动选择题</title>
<style>
  :root {
    --bg:#0b0f14; --card:#111826; --muted:#9aa4b2; --text:#e6edf3; --accent:#4ea1ff;
    --good:#20c997; --bad:#ff6b6b; --border:#223044;
  }
  body {
    margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC",
      "Hiragino Sans", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif;
    background: linear-gradient(180deg, var(--bg), #070a0f 60%);
    color: var(--text);
  }
  header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky; top:0; background: rgba(11,15,20,.92); backdrop-filter: blur(6px);
    z-index: 5;
  }
  h1 { margin:0 0 6px; font-size: 18px; font-weight: 800; }
  .sub { color: var(--muted); font-size: 12px; line-height: 1.5; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  .row { display:flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .card {
    background: var(--card); border:1px solid var(--border); border-radius: 14px;
    padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  label { display:inline-flex; gap:8px; align-items:center; cursor:pointer; color: var(--text); }
  input[type="checkbox"] { transform: translateY(1px); }
  button {
    appearance:none; border:1px solid var(--border); background:#0f172a; color: var(--text);
    border-radius: 10px; padding: 10px 12px; cursor:pointer; font-weight: 700;
  }
  button.primary { background: var(--accent); border-color: transparent; color:#07111f; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  .pill {
    font-size: 12px; color: var(--muted); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 999px;
  }
  .qmeta { display:flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .qtitle { font-weight: 800; }
  .stem {
    white-space: pre-wrap; line-height: 1.65; font-size: 14px; margin-top: 10px;
  }
  .opts { margin-top: 10px; display:grid; gap: 8px; }
  .opt {
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 10px;
    display:flex; gap:10px; align-items:flex-start; background: rgba(255,255,255,.02);
  }
  .opt:hover { border-color: rgba(78,161,255,.55); }
  .opt input { margin-top: 3px; }
  .opt .txt { white-space: pre-wrap; line-height: 1.55; font-size: 14px; }
  .feedback {
    margin-top: 12px; border-top:1px dashed var(--border); padding-top: 12px;
  }
  .ok { color: var(--good); font-weight: 900; }
  .ng { color: var(--bad); font-weight: 900; }
  .explain { margin-top: 8px; white-space: pre-wrap; line-height: 1.6; color: #d7e2f0; }
  .footer { margin-top: 14px; display:flex; gap:10px; flex-wrap: wrap; }
  .small { font-size: 12px; color: var(--muted); line-height: 1.6; }
  details {
    border: 1px solid var(--border); border-radius: 12px; padding: 10px;
    background: rgba(255,255,255,.02);
  }
  summary { cursor:pointer; font-weight: 800; }
</style>
</head>
<body>
<header>
  <div style="max-width:980px;margin:0 auto;">
    <h1>劳动法B 后期试题｜在线互动选择题</h1>
    <div class="sub">已把两份PDF（Tue/Wed）全部题目做成可离线打开的互动题库：提交后显示对错 + 中文解析；自动保存进度与错题回顾（保存在浏览器本地）。</div>
  </div>
</header>

<main>
  <div class="card">
    <div class="controls">
      <span class="pill">来源筛选</span>
      <label><input type="checkbox" id="srcWed" checked> Wed（1/22）</label>
      <label><input type="checkbox" id="srcTue" checked> Tue（1/21）</label>
      <span style="width:10px;"></span>
      <label><input type="checkbox" id="shuffle" checked> 随机出题</label>
      <label><input type="checkbox" id="showJapanese" checked> 显示日文题干</label>
      <button class="primary" id="startBtn">开始 / 重开</button>
      <span class="pill" id="statusPill">未开始</span>
    </div>
    <div class="small" style="margin-top:10px;">
      用法：选来源 → 点“开始” → 选项后点“提交”。做完可点“错题回顾”。（若你把此HTML放到网盘/网站，就能当“在线题库”。）
    </div>
  </div>

  <div class="card" id="quizCard" style="margin-top:12px; display:none;">
    <div class="qmeta">
      <div class="qtitle" id="qtitle"></div>
      <div class="row">
        <span class="pill" id="progress"></span>
        <span class="pill" id="score"></span>
      </div>
    </div>

    <div class="stem" id="stem"></div>
    <div class="opts" id="opts"></div>

    <div class="footer">
      <button id="submitBtn" class="primary" disabled>提交</button>
      <button id="nextBtn" disabled>下一题</button>
      <button id="jumpWrongBtn">跳到下一道错题</button>
      <button id="reviewBtn">错题回顾</button>
      <button id="resetBtn">清空记录</button>
    </div>

    <div class="feedback" id="feedback" style="display:none;"></div>
  </div>

  <div class="card" id="resultCard" style="margin-top:12px; display:none;">
    <div class="qtitle">结果汇总</div>
    <div class="small" id="resultText" style="margin-top:8px;"></div>
    <div id="wrongList" style="margin-top:10px; display:grid; gap:8px;"></div>
  </div>

  <div class="card" style="margin-top:12px;">
    <div class="qtitle">提示</div>
    <div class="small">
      <div>• 解析按一般教科书/判例理解整理，若老师课上有特别口径，以老师为准。</div>
      <div>• 题干为PDF文字抽取，个别行可能略有缺字（不影响选项判断）。</div>
    </div>
  </div>

  <script id="DATA" type="application/json">[{"id": "Tue-01", "source": "Tue", "number": 1, "stem": "非正規雇用に関する記述として適当でないものを１つ選び、マークせよ。", "options": ["総務省の労働力調査によれば、日本では、全年齢層にわたり非正規雇用者数がお おむね増加傾向にあり、３５～４４歳の層では約３割弱、４５～５４歳の層では約３ 割強にのぼる。", "日本では、自己都合による離職率は、非正規雇用者の方が正規雇用者より高いと する公的データがある。", "日本の正規・非正規労働者間の労働条件格差は、OECD 加盟国の中で相対的に大 きいが、徐々に縮小してきている。しかし、正規労働者における昇進昇格の可能性や 雇用安定性を数値化して加味したデータではない。", "日本の非正規雇用の特徴は、組織内で、正規雇用労働者よりも「格下」または 「よそ者」と位置付けられ易いことにあるが、丸子警報器事件の地裁判決は、雇用形 態の違いゆえの賃金格差は、労基法第３条の定める「社会的身分」による差別に該当 すると解釈すると共に、雇用平等に関する諸規定に通底する「均等待遇の理念」に反 するので、諸条件が同じ前提で２割を超える格差は違法とした。"], "correctIndex": 3, "explanation": "选④。丸子警報器事件并未把‘雇用形态差别’直接认定为労基法3条的“社会的身分”歧视，也不是以‘差额2成’为违法标准；该选项对判旨与基准描述失真。"}, {"id": "Tue-02", "source": "Tue", "number": 2, "stem": "労働者供給と労働者派遣に関する記述として適当でないものを１つ選び、マー クせよ。", "options": ["労働者供給とは、供給者－受給者間の供給契約に基づき労働者が供給されていて いれば該当し、受給者－労働者間の契約が締結されなくても、労働者供給であること に変わりはない。", "労働者派遣は、雇用と使用を分離する制度であり、ドイツでは、貸借労働関係と も呼ばれている。", "労働者派遣は、実質的には労働者供給の一環だが、産業の進展、雇用促進などさ まざまな目的をもって、合法化されると共に内容規制がなされるようになった経緯が あり、職業安定法における労働者供給の定義規定（第４条第８項）でも、労働者派遣 がその定義から排除されてはいない。"], "correctIndex": 2, "explanation": "选③。职安法上‘労働者供給’的定义通常明确排除依法进行的労働者派遣；因此说“并未排除派遣”不当。"}, {"id": "Tue-03", "source": "Tue", "number": 3, "stem": "労働者派遣に関する記述として適当でないものを１つ選び、マークせよ。", "options": ["労働者派遣法第２６条に定められた派遣契約に定めるべき事項は、派遣労働者の 雇用条件に実質的に関わるため、法第３４条は、派遣に際して派遣労働者に明示する こと義務にづけている。", "派遣就業の条件について、派遣元事業主から受けた説明と異なる等の派遣就業上 の問題が生じた場合、現行派遣法上、派遣労働者は、派遣先責任者と派遣元責任者の 双方に苦情を述べなければ、両者が連携した適切な対処を受けられない状況にある。", "派遣元が派遣先から得る派遣料金は、規制されていない。", "派遣労働者に対する安全配慮義務を派遣先が負う場合にも、派遣元の安全配慮義 務が免除されるとは限らない。"], "correctIndex": 1, "explanation": "选②。派遣劳动者可以向派遣先或派遣元任一方提出苦情，双方应协力处理；并非必须同时向两边都提才有协调义务。"}, {"id": "Tue-04", "source": "Tue", "number": 4, "stem": "労働者派遣に関する記述として適当でないものを１つ選び、マークせよ。", "options": ["紹介予定派遣は、「派遣先に対し派遣労働者を雇用させることを約束して行うも のはそもそも派遣には該当しない」旨を定める派遣法第２条第１号と矛盾するため違 法だが、黙認されてきた。", "平成２７年の派遣法改正により、派遣元に雇用安定化措置が求められることとな り、求められる措置の中には、派遣先への直接雇用の依頼も含まれているが、法的拘 束力はない。", "平成２７年の労働者派遣法改正で、特定労働者派遣も許可制となり、一般労働者 派遣と統一された。", "二重派遣は、労働者派遣法で明確に禁止されていないが、労働者供給として違法 の扱いを受ける。"], "correctIndex": 0, "explanation": "选①。介绍预定派遣是合法制度（派遣与将来雇用的“介绍”结合），不因‘与派遣定义矛盾’而当然违法。"}, {"id": "Tue-05", "source": "Tue", "number": 5, "stem": "労働者派遣に関する記述として適当でないものを１つ選び、マークせよ。", "options": ["労働者派遣法制度は、平成１１年改正で派遣対象業務がネガティブ・リスト化 （原則解禁）されると共に派遣期間が原則１年間に制限され、平成１５年改正では、 派遣対象業務がさらに拡大されると共に派遣期間の例外枠が拡がり、他方で、法定派 遣期間を超える場合、派遣先は派遣労働者に雇用の申し込みを行うことが義務化され た。しかし、申込みを行わなくても、締約強制はできなかった。", "平成２４年の労働者派遣法改正では、日雇い派遣の原則禁止、同種の業務に従事 する派遣先労働者との労働条件の均衡を図る規定が新設され、焦点であった違法派遣 を承知で派遣労働者を使用した派遣先に直接雇用の申込を行ったものとみなす旨の規 定が設けられた。この場合、労働者側が承諾すれば、締約強制できる。", "平成２４年の労働者派遣法改正では、派遣先都合での派遣契約解除の際、派遣先 が新たな就業機会の確保、休業手当の支払いに要する費用負担などにつき措置を講じ ることが派遣先に義務づけられ、これらの措置を派遣契約に盛り込む措置も義務づけ られた。これにより、派遣労働者には雇用の安定が保障されることになった。", "平成２４年の労働者派遣法改正では、離職後１年以内の人物を元の勤務先に派遣 すること及びそうした派遣を受け入れることを共に禁じたが、その趣旨は、本来直接 雇用とすべきポストの派遣労働者への代替を防ぐことにあった。"], "correctIndex": 2, "explanation": "选③。派遣先中途解除派遣契约时的“雇用安定措置”强调努力与配慮（如补偿、安置等），并不等于‘当然保证就业稳定’。"}, {"id": "Tue-06", "source": "Tue", "number": 6, "stem": "平成２７年の労働者派遣法改正に関する記述として適当でないものを１つ選 び、マークせよ。", "options": ["派遣事業の許可基準の１つに、当該派遣元の就業規則等に、雇用契約の無期・有 期を問わず、派遣契約の終了のみをもって派遣労働者を解雇できる旨の定めがないこ とが設けられた。これは登録型派遣（一般型派遣）を禁止する趣旨ではない。", "派遣期間に関する制限は、派遣先事業所単位、派遣労働者個人単位共に、派遣元 と派遣先の双方に課されることとなったが、罰則は派遣元のみに付された。なお、そ れまで派遣期間の制限のなかった２６業種についても、最長３年間の制限の対象とさ れた。", "派遣先事業所単位での規制として、派遣先の同じ事業所における派遣労働者の受 け入れは最長３年とされ、それを超える場合には、過半数代表等の意見を聴くこと で、3 年以内の延長が許されることとされた。", "派遣労働者個人単位での規制として、同じ派遣労働者を同じ事業所の同じ組織単 位に３年を超えて派遣することは禁止されたが、別の人物に代えれば、派遣事業所単 位での規制をクリアする限り、同じ事業所の同じ組織単位での派遣も許されることと なった。"], "correctIndex": 1, "explanation": "选②。期间限制相关的义务与责任不只落在派遣元，派遣先也承担法定义务与（违反时的）行政处分等；把“罚则只给派遣元”说法不当。"}, {"id": "Tue-07", "source": "Tue", "number": 7, "stem": "業務処理請負、職業紹介、出向、労働者供給に関する記述として適当でないも のを１つ選び、マークせよ。", "options": ["業務処理請負では、業者等が発注者から受注した仕事を完成させるため、自ら雇 用する労働者を自ら使用することが前提となるが、発注内容の具体化との実質的な区 別が難しく、仕事の発注者が受注者の労働者に対して指揮命令するような実態がみら れるため、行政が判断基準を示すなどして注意喚起をしている。", "職業紹介は、紹介者が求職者と求人者の間で「あっせん」を行い、両者間の直接 の雇用関係を成立させようとするもので、戦後長らく、原則として国や地方公共団体 が行う無償のサービスに限定されてきた。その後、平成８年の職安法施行規則の改定 で有料職業紹介が原則解禁され、厳しい手数料制限が緩和され、ヘッドハンティング 的な事業も認められるようになった。", "出向では、一般に、出向元－出向する労働者、出向先－出向する労働者の２つの 関係で労働契約が締結されると解されている。民法第６２５条第１項による制約を受 けるため、代表的な判例は、たとえ在籍出向であって、就業規則等に根拠規定があ り、出向後に出向元での労働条件が保障されるなどの条件があっても、本人の個別同 意がなければ、出向命令を違法無効としている。", "労働者供給とは、供給元と供給先間の供給契約に基づき労働者が供給されること であり、供給先と労働者の間に雇用契約が締結されている必要はない。"], "correctIndex": 2, "explanation": "选③。出向并非一律必须个别同意；若劳动合同/就业规则等已设定并且具合理性，判例也承认可以在一定范围内命令出向。"}, {"id": "Tue-08", "source": "Tue", "number": 8, "stem": "有期雇用および／または労働者派遣に関する説明として、適当でないものを１つ 選択せよ。", "options": ["労基法第１９条は、業務上の傷病による休業期間中の解雇を規制しているとこ ろ、派遣労働者がそのような状態に至った場合、派遣契約が解除されれば、派遣元に よる派遣労働者の解雇は許されるとの行政解釈がある。", "労基法第１９条は、業務上の傷病による休業期間中の解雇を規制しているが、有 期契約者の場合、その契約期間が満了すれば、その傷病が快復していなくても契約を 終了させられる旨の行政解釈がある。", "労働者派遣の期間制限は、事業所単位、個人単位共に、3 か月のクーリング期間 を設ければ１から起算される。これに対し、有期契約の無期転換ルールのクーリング 期間は６ヶ月である。", "東洋大学の鎌田教授は、派遣法による規制のあり方を考える際には、(i)派遣事業 が持つ意義（需給調整、temp to perm など）の実現、(ii)派遣労働者の保護、(iii)派遣 先の長期雇用労働者の雇用上の利益の確保（常用代替禁止）の３つの観点が必要とし ている。"], "correctIndex": 0, "explanation": "选①。労基法19条是对“解雇”的限制（含使用者的解雇行为），派遣先解除派遣契约并不能让派遣元当然取得‘可解雇’的行政解释；相反，派遣元仍负保护与安置义务。"}, {"id": "Tue-09", "source": "Tue", "number": 9, "stem": "松下 PDP 事件（最２小判平成２１年１２月１８日）に関する説明として、適当で ないものを１つ選択せよ。 なお、以下において、X は１審原告（Y の社外工であり、Y の下請会社であった訴外 C 社の元被用者）、Y は１審被告を指す。", "options": ["原審は、Y－C 間の契約を職業安定法に照らして違法かつ民事上公序に反する労務 供給契約としたうえ、Y－C 及び C－X 間の契約（労務供給契約と雇用契約）につい て、いずれも契約当初から無効とした。", "原審は、Y－X 間に黙示の雇用契約が成立していたとした。", "原審は、Y－X 間の雇用契約は、Y－C 間の雇用契約を引き継いで有期の契約とな ったと認めたが、有期契約であるため、その期間満了による雇止めは有効とした。", "上告審は、C は X を Y に違法に派遣していたが、X－C 間の雇用契約は有効に存在 していたと判断した。", "上告審は、X－Y 間の雇用契約は、1 期であり、事前の Y による説明からも、契約 更新拒絶は期待権の侵害に当たらないとした。"], "correctIndex": 2, "explanation": "选③。松下PDP案中，下级审与最高裁的评价并不如该选项所述那样‘下级审认定雇止め当然有效’；整体上，这一描述与案件判断结构不一致。"}, {"id": "Tue-10", "source": "Tue", "number": 10, "stem": "アテスト（ニコン熊谷製作所）事件２審東京高判平成２１年７月２８日に関 する説明として、適当でないものを１つ選択せよ。 なお、以下において、X は１審原告（Y２（アテスト）に雇用され、Y１（ニコン） で就労していた亡 A の遺族）、Y は１審被告を指す。", "options": ["判決は、労働者派遣では、受役務者（派遣先）は、直用労働者に比べて派遣労働 者を酷使しがちで、それは派遣制度自体の問題である旨を述べた。", "判決は、派遣元は、派遣労働者の派遣先における就業状況を把握し、過重労働等 が行われるおそれがあるときは、その是正等を受役務者に求めたり、必要に応じて派 遣を停止するなどして、その健康を保護する注意義務を負う旨を述べた。", "判決は、結論的に、Y1 につき、その従業員が X に過重労働をさせたことを理由と する使用者責任があり、Y2 には派遣先での就業状況を監視して、過重労働等の実態が あれば是正させるか派遣を停止する等の注意義務があるが、Y2 は亡 A と給与の支払い 程度の関係しかなく、それを怠っていたとはいえないとして、Y1 のみに損害賠償の支 払いを命じた。 （１１～１２）従来の判例によれば、有期雇用契約が反復継続された場合、反復の回数、 （ア ）、採用時の使用者側の説明内容、（イ ）の有無・方法、同様の条件にあ る労働者の雇止め実績の有無、有期契約者の（ウ ）などの事情から、概ね、（i）無 期限雇用に転化する場合（転化説）、（ii）無期限雇用と同視すべき状態となり、解雇 権濫用規制（or 法理）が適用される場合（擬似転化説）、（iii）転化説も擬似転化説も 採り得ないが、従前と同様の有期雇用契約が更新されたのと同様の法律関係になり、雇 止めに解雇権濫用規制が（エ ）される場合（非転化・有期契約更新説）、（iv）転 化説、擬似転化説、非転化・有期契約更新説ともに採り得ないが、契約更新への（オ ） は法的評価に値するので、（オ ）権（or（オ ）的利益）の侵害として、損害賠 償請求権を根拠づける場合（（オ ）権侵害説）、（v）（i）～（iv）のいずれの説 も採り得ない場合、の５種類が想定されて来た。 こうした判例傾向などを踏まえ、平成２４年８月（但し公布日）に（カ ）法 の改正が行われた。"], "correctIndex": 2, "explanation": "选③。アテスト（ニコン熊谷）案中，关于过劳自杀的安全配慮義務，派遣先与派遣元均被认定负有相应义务并可能承担赔偿责任；说“派遣元不负责任、仅派遣先赔偿”不当。"}, {"id": "Tue-11", "source": "Tue", "number": 11, "stem": "ア～ウ", "options": ["ア 契約書の有無 イ 契約更新手続 ウ 賃金額", "ア 日常の勤務態度・成績 イ 採用試験 ウ 賃金額", "ア 契約継続期間の長さ イ 契約更新手続 ウ 職務内容・職責", "ア 日常の勤務態度・成績 イ 採用試験 ウ 職務内容・職責"], "correctIndex": 1, "explanation": "选②。雇止め判断常看：雇用持续期间、更新手续与运用、职务内容与责任等（综合判断），该组合最贴近判例要素。"}, {"id": "Tue-12", "source": "Tue", "number": 12, "stem": "エ～カ", "options": ["エ 類推適用 オ 合意 カ 労働基準", "エ 類推適用 オ 合意 カ 労働契約", "エ 類推適用 オ 期待 カ 労働契約", "エ 拡張適用 オ 期待 カ 労働契約", "エ 拡張適用 オ 合意 カ 労働契約", "エ 拡張適用 オ 期待 カ 労働基準"], "correctIndex": 0, "explanation": "选①。雇止め法理=解雇権濫用法理类推适用；核心保护对象是更新“期待”利益；2012年写入《労働契約法》。"}, {"id": "Tue-13", "source": "Tue", "number": 13, "stem": "Y（会社）側から賃金の引き下げを条件に次期の契約更新を提案された X（有 期契約者）が、異議留保つき承諾回答を行ったところ、雇止めされた事案に関する日 本ヒルトン事件２審（東京高判平成１４年１１月２６日）は、要約、以下のように述 べ、X からの契約上の地位確認、就労拒否後の賃金相当額の支払い等を求めた請求を （ア ）した。 （イ ）", "options": ["ア 認容 イ XY 間の労働契約は有期契約ではあったが、既に複数回にわたる更新がなされ ており、契約の継続期間も長く、従前更新拒絶を受けた者もない等の事情にかんがみ て、「実質的に無期契約と同様の状態になっていたと解され、その更新拒絶には解雇 権濫用法理が類推適用されるべきところ、本件では客観的合理性も社会的相当性も認 められず、違法無効である」。", "ア 棄却 イ XY 間の労働契約が有期契約であった以上、「他の点を審査するまでもなく、 X の請求は、締約強制を求めるものであって、法的に認められない」。", "ア 認容 イ 労働条件変更に合理性が認められる以上、Y による変更後の条件による雇用 契約更新の申込みは有効だが、民法第５２８条に照らせば、これに対する異議留保つ き承諾回答は、変更後の労働条件に基づく労働契約の締結申入れと解されるべきであ り、「Y は、この申入れに異議留保が付いていたことを理由に本件雇止めをすること は許されない」。", "ア 棄却 イ 労働条件変更に合理性が認められる以上、Y による変更後の条件による雇用 契約更新の申込みは有効であり、民法第５２８条に照らせば、これに対する異議留保 つき承諾回答は、Y による「契約更新の申込みに基づく・・・・・合意は成立してい ないとして後日争うことを明確に示すものであり、Y の申込みを拒絶したものといわ ざるを得ない」。 ＜労働時間法＞"], "correctIndex": 3, "explanation": "选④。日本ヒルトン事件（东京高裁）在认为降薪必要性/合理性较强的前提下，将‘异议留保承诺’评价为对要约的拒绝/反要约（民法528条思路），并据此作出对劳动者不利的结论，因此该概括最符合。"}, {"id": "Tue-14", "source": "Tue", "number": 14, "stem": "労基法上の労働時間概念に関する説明として、適当でないものを１つ選択せ よ。", "options": ["労基法上の労働時間について、判例は、原則として、折衷説（客観的に使用者の 指揮命令下にあったか否かと、労使がどう考えたかの双方を勘案して判断する考え 方）の立場はとらず、主に使用者の関与や業務性の観点から指揮命令下にあったか否 かを客観的に判断する立場をとっている。", "労基法上の労働時間に関する判例の中には、労働安全衛生法などの国の法令によ り、使用者が実施することを義務づけられている事項に対応するための時間は、同法 上の労働時間であるとするものがあり、たとえば特殊健診（有害な作業環境の健康影 響等を測定する健診）の実施時間は労働時間とすべきとされている。しかし、一般健 診（労働者の健康状態を基準として、その増悪の防止等を主な目的とする健診）の実 施時間は、同法上の労働時間とする必要はないと解されている。", "裁判例によれば、タイムカード制度が採られている会社で、タイムカード上就業 していたと記録されている時間以外でも、労基法上の労働時間に当たり得る。", "いわゆる OffJT（企業外研修）としての研修時間は、会社の指示によるものでも、 本人の利益になるため、労基法上の労働時間に該当し得ないと解されている。"], "correctIndex": 3, "explanation": "选④。公司指示参加的Off-JT/研修，即使对劳动者有利，也通常属于使用者指挥命令下的时间，应计入労働時間；不能一概排除。"}, {"id": "Tue-15", "source": "Tue", "number": 15, "stem": "労基法上の労働時間規制に関する説明として、適当でないものを１つ選択せ よ。", "options": ["労基法上の労働時間規制を大別すると、原則（基本的枠組）、例外（３６協定等 による法定労働時間の延長）、原則・例外の適用自体を排除する適用除外制度、原 則・例外の運用ないし算定方法を柔軟化する制度の４種に分かれる。", "平成１０年の労基法改正により、同法第３６条第２項に、厚生労働大臣による、 労働時間の延長の限度等に関する基準（限度基準）の設定権限が定められ、第３項 に、３６協定や労使委員会決議の内容を、その「基準に適合したものにしなければな らない」との規定が設けられた。しかし、その刑事上の効力（：基準に違反した場合 に犯罪とする）や民事上の効力（強行性・直律性）は否定する説が一般的だった。", "働き方改革関連法の制定により、法定時間外労働の限度は労基法に直接定められ ることとなったため、厚生労働大臣が告示する法定時間外労働にかかる限度基準は廃 止され、別途、留意事項等に関する指針（平成 30 年 9 月 7 日厚生労働省告示第 323 号）が設けられた。", "働き方改革関連法の制定により、労基法では、月４５時間、年３６０時間を原則 として、例外的な事情がある場合には、年７２０時間、単月１００時間（休日労働含 む）、複数月平均８０時間（休日労働含む）が、絶対的な時間外労働の限度とされ た。医師や自動車運送業運転手などの職種にも、例外は認められていない。"], "correctIndex": 3, "explanation": "选④。行业领域确有一定的例外/特例（如运输、医疗等在上限规制、特別条项或经特定程序时的取扱），说“一律不存在例外”不当。"}, {"id": "Tue-16", "source": "Tue", "number": 16, "stem": "裁量労働制・フレックスタイム制・変形労働時間制に関する説明として、適 当でないものを１つ選択せよ。", "options": ["企画業務型裁量労働制は、専門業務型裁量労働制と同様に、みなし労働時間制の 一種であり、事業場外みなし制と同類の制度である。いずれも、その導入に際して対 象労働者の個別同意が必要とされている。", "裁量労働制・フレックスタイム制の適用対象者にも、休日・休憩に関する規定は 適用される。", "事業場外みなし制には、実働時間とみなし時間に乖離（：かいり）がある場合に みなし時間の調整を行うべき旨の定めがあるが、裁量労働制にそうした定めはない。 裁量労働の対象業務の性格、労使協定による適正の担保への期待が主な理由と解され る。", "使用者の安全配慮義務は、裁量労働制の適用対象者にも適用される。", "変形労働時間制は、使用者側が日々の始終業時間を裁量で調整して指示できる制 度であり、１週間単位、１か月単位、１年単位の３種類から成る。単位期間が長いほ ど、1 日あたりの時間上限など、適用上厳しい制限が課せられている。 ＜年次有給休暇＞"], "correctIndex": 0, "explanation": "选①。远程/事業场所外的“みなし労働時間制”并不以个别劳动者同意为前提；而企画/専門裁量等才强调労使协定与（部分制度下）本人同意。"}, {"id": "Tue-17", "source": "Tue", "number": 17, "stem": "年次有給休暇に関する説明のうち、適当でないものを１つ選択せよ。", "options": ["ILO 第 132 号条約は、おそらくはヨーロッパのバカンスを念頭に、年休の最低付 与日数を３週間とし、最低２週間は連続して付与すべき旨規定するなど、現在の日本 の状況からすると高い水準を定めており、日本は、同条約を批准できていない。", "ILO 第 132 号条約は、人間らしい生活のためという年休の趣旨を反映した年休の 自由利用原則を重視し、労働者の病気等による欠勤を年休扱いとすることにも肯定的 な立場を採っている。", "ILO 第 140 号条約は、一般教育、社会教育および市民教育のための有休休暇を、 年次有給休暇とは別に設けるべきとしている。", "ILO の条約や勧告に徴すれば、年休には、主に疲労回復（労働力維持培養）と自 由時間保障（休息権保障）の２つの趣旨があると解することができる。"], "correctIndex": 1, "explanation": "选②。ILO132号公约更强调年休用于休养，病欠原则上不应被当作年休；说公约积极支持“按劳动者请求把病欠算进年休”不当。"}, {"id": "Tue-18", "source": "Tue", "number": 18, "stem": "年次有給休暇に関する説明のうち、適当でないものを１つ選択せよ。", "options": ["最高裁は、一斉休暇闘争は、使用者の時季変更権の行使を無視してかかるもので あるため、形式上労基法上の取得要件を満たしても、正当な年休権の行使とは認めら れない旨を述べている。", "年休自由利用原則といえども、使用者の時季変更権の成立要件を拡大解釈すれ ば、理論上、比較的容易に形骸化させることができるが、電電公社此花電報電話局事 件２審（大阪高判昭和５３年１月３１日）からも明らかなように、実際にそうした司 法判断は見られない。", "代表的な最高裁判例は、現行労基法第３９条第５項に定める「請求」の文言は 「指定」の意味であり、労働者の年休権は請求権ではない。よって、法定要件を充た して一定日数分の年休取得の権利を得たり、使用者が適正に時季変更権を行使しない 限り、時期指定権を行使して実際に年休を取得する過程に、使用者の「承認」は必要 ないとした。", "行政解釈では、労働者により年度内に時季指定がなされなかった法定年休の買い 取りは違法と解されている。 ＜労働者の健康と法＞"], "correctIndex": 0, "explanation": "选①。年休的时季指定权原则上属于劳动者，只要形式要件满足，‘集体同时请休’并不当然失去正当性；把其一概评价为“不当且不具正当性”不当。"}, {"id": "Tue-19", "source": "Tue", "number": 19, "stem": "労働者の健康と法に関する説明のうち、適当でないものを１つ選択せよ。", "options": ["業務上の事由による疾病障害で療養中の労働者の解雇は、労基法上、最低３年間 は制限されるが、３年の経過後、事業主が打切補償を支払うか、傷病補償年金の支給 を受けることとなれば、同法上の制限は免れる。しかし、民事上の解雇規制がこれに 連動するとは限らない。", "東芝事件の高裁判決（平成 23 年 2 月 23 日）等によれば、業務上の事由による疾 病障害で就労不能となった労働者は、民法第 536 条第 2 項の適用を受け、当該疾病障 害が発症しなければ就労し、得られたはずの賃金の支払いを受ける権利を失わず、過 失相殺等の損益相殺も受けないと解されている。", "業務上の事由による不調者が、所定業務を遂行できない場合にも、使用者が休職 命令を下すことはできるが（むしろ健康配慮義務との関係上、下さなければならない 場合もあるが）、雇用や所得の保障が求められる。", "労働者が私的な事由による疾病障害で就労不能となった場合、使用者の法的な健 康配慮や解雇回避努力の義務は制限されるため、休養措置、復職支援や就労可能なポ ストの探索による雇用継続措置を行う必要はない。 ＜配置転換と出向＞"], "correctIndex": 3, "explanation": "选④。即使是私伤病，也可能触发健康配慮義務与解雇回避义务（如休职、配置考虑等，依个案而定）；说“几乎不必采取任何措施”过于绝对。"}, {"id": "Tue-20", "source": "Tue", "number": 20, "stem": "配置転換や出向に関する説明のうち、適当でないものを１つ選択せよ。", "options": ["東亜ペイント事件において、１・２審は、１審被告会社の労働協約や就業規則の 規定に即しつつ、使用者側の配転措置の業務上の必要性と労働者側の配転拒否の正当 事由をほぼ対等に比較衡量する判断基準を採用し、結論的に後者が前者を上回ること を理由に権利濫用に当たると判断したが、上告審は、１審被告会社の労働協約や就業 規則が同社に一般的な配転命令権限を定めていたことのほか、１審原告が大卒営業社 員であった事情等を前提に、原則として使用者による業務上の必要性を広く、労働者 側の事由を狭く解する方針を示しつつ、実際の当てはめでも配転命令の有効性を認 め、１審被告会社による懲戒解雇を合法とした。", "製薬メーカーの MR だった１審原告が、東京営業所から名古屋営業所に転勤を命 じられ、妻及び三人の子供と別居せざるを得なくなったことを違法であるとして、右 転勤命令の無効確認と、単身赴任を強いられたことによる損害賠償を求めた帝国臓器 事件では、下級審も上告審も、業務上の必要性に基づくものであって、不当な動機、 目的をもってされたものではないが、上告人らの被る経済的、社会的、精神的不利益 が、社会通念上甘受すべき程度を著しく超えるものであるとして、請求を認容したう え、一般論として、転居を伴う配転に際しては、その不利益を緩和するための配慮が 必要とした。", "新日本製鉄事件最高裁判決では、１審被告会社の就業規則や１審原告らにも適用 される労働協約に、社外勤務を命じる旨の規定があったこと、労働協約に当たる社外 勤務協定に、社外勤務の定義、出向期間、出向中の社員の地位、賃金、退職金、各種 の出向手当、昇格・昇給等の査定その他処遇等に関して出向労働者の利益に配慮した 詳細な規定が設けられている等の事情を前提に、民法第６２５条に基づき、出向措置 の際に必要となる労働者の同意についても、個別同意である必要を認めず、１審被告 人による在籍出向命令を有効とした。"], "correctIndex": 1, "explanation": "选②。帝国臓器事件中，最高裁并非全面支持劳动者并认定转勤命令违法；其判旨更接近认可企业的配転裁量，在未达权利滥用程度时通常有效。"}, {"id": "Wed-01", "source": "Wed", "number": 1, "stem": "非正規雇用に関する記述として適当でないものを１つ選び、マークせよ。", "options": ["非正規雇用に間接雇用も含まれる。", "日本では、これまで非正規雇用という文言を用いた法令はなく、最近制定された 有期・パートタイム労働法でも用いられてはいない。", "フランスの非正規雇用と日本の非正規雇用をめぐる法規制は、双方共に、出口 （：解約ないし就業の終了時点）規制を重視し、入口（：契約締結ないし就業開始時 点）規制は最小限とされている。", "日本の非正規雇用の特徴は、組織内で、正規雇用労働者よりも「格下」または 「よそ者」と位置付けられ易いことにあるが、丸子警報器事件の地裁判決は、非正規 雇用であるがゆえの賃金格差は、労基法第３条の定める「社会的身分」による差別に は該当しないと解釈した。"], "correctIndex": 2, "explanation": "选③。法国对有期/派遣（CDD等）有很强的“入口规制”（限定事由、期限等），并非像日本一样主要靠退出规制（解雇法理）来兜底；因此说两国都‘入口几乎不管、只强调出口’不符合比较法事实。"}, {"id": "Wed-02", "source": "Wed", "number": 2, "stem": "労働者供給と労働者派遣に関する記述として適当でないものを１つ選び、マー クせよ。", "options": ["労働者供給は、現在、職安法第４条で定義され、第４４条で供給が禁止されてい るが、受給は禁止されていない。", "労働者派遣は、雇用と使用を分離させる制度であり、ドイツでは、貸借労働関係 とも呼ばれている。", "職業紹介は労働者供給に該当し得る。", "労働者派遣は、実質的に労働者供給の一形態だが、産業の進展、雇用促進などさ まざまな目的をもって、合法化されると共に内容規制がなされるようになった経緯が あり、現在に至るまで、内容規制の在り方をめぐる労使間の攻防が続いている。"], "correctIndex": 2, "explanation": "选③。职业介绍（職業紹介）是‘把劳动者介绍给用人单位，由用人单位直接雇用’，与‘供给/派遣’（受领方指挥命令但雇用关系在别处）在结构上不同，一般不会被评价为‘労働者供給’。"}, {"id": "Wed-03", "source": "Wed", "number": 3, "stem": "労働者派遣に関する記述として適当でないものを１つ選び、マークせよ。", "options": ["派遣料金自体に上限規制は設けられていないが、平成２４年の法改正により、派 遣元が得る手数料率の公表が義務付けられた。", "派遣先は、指揮命令関係に基づいて、派遣労働者に対する安全配慮義務を負い、 派遣元も、雇用契約関係に基づいて安全配慮義務を負うが、指揮命令関係がなく、労 災の予見も回避もできない場合、同義務が発生しないこともある。", "労働者派遣法第２６条に定められた派遣契約に定めるべき事項は、派遣労働者の 雇用条件に実質的に関わるが、派遣労働者が当事者ではないため、法第３４条は、派 遣に際して派遣労働者に明示すること努力義務にとどめている。", "派遣就業の条件について、派遣元事業主から受けた説明と異なる等の派遣就業上 の問題が生じた場合、現行派遣法上、派遣労働者は、派遣先責任者と派遣元責任者の いずれかに苦情を述べれば、両者が連携して対応する必要が生じる。"], "correctIndex": 2, "explanation": "选③。派遣元向派遣劳动者明示派遣条件（就业条件、派遣内容等）属于法定义务，不是‘努力义务’。把它说成努力义务不当。"}, {"id": "Wed-04", "source": "Wed", "number": 4, "stem": "労働者派遣に関する記述として適当でないものを１つ選び、マークせよ。", "options": ["朝日放送事件最３小判平７年２月２８日は、派遣先が派遣労働者の加入する組合 との団体交渉に応じる義務を負うかについて、実質的な支配力（決定力）を持つ事柄 については、派遣先であっても応諾義務を負うと述べた。", "労働者派遣法は、第２条第１号で、「派遣先に対し派遣労働者を雇用させること を約束して行うものはそもそも派遣には該当しない」旨を定めている。しかし、temp to perm を基本方針としているため、第３３条第２項で、派遣労働者が派遣終了後に派 遣先に直接雇われることを妨げるような派遣契約を結んではならない旨を定めてい る。また、平成１５年の法改正では、紹介予定派遣（いわゆる job search 型派遣）が 法第２条第６号などに制度として明文化された。これは、派遣就業の結果、派遣先に 気に入られたので、紹介することになったという説明で、法第２条第１号との矛盾が 回避された制度だが、違法との司法判断が相次いでいる。", "労働者派遣法は、二重派遣を明文をもって禁止してはいないが、労働者派遣は、 そもそも労働者供給として禁止されるべきものを法律で特別に認めたものであり、派 遣法で認められていない以上、労働者供給として許されないと解されている。", "平成２７年の労働者派遣法改正で、特定労働者派遣と一般労働者派遣共に許可制 となった。"], "correctIndex": 1, "explanation": "选②。介绍预定派遣（紹介予定派遣）是法律明确承认的派遣形态，不是“因为和定义矛盾所以不属于派遣且多被判违法”。该叙述与制度现状不符。"}, {"id": "Wed-05", "source": "Wed", "number": 5, "stem": "労働者派遣に関する記述として適当でないものを１つ選び、マークせよ。", "options": ["労働者派遣法制度は、平成１１年改正で派遣対象業務がネガティブ・リスト化 （原則解禁）されると共に派遣期間が原則１年間に制限され、平成１５年改正では、 派遣対象業務がさらに拡大されると共に派遣期間の例外枠が拡がり、他方で、法定派 遣期間を超えた場合の雇用の申込が義務化された。これにより、派遣労働者が承諾さ えすれば、裁判所は同人と派遣先との雇用契約の締結を強制できることとなった。", "平成２４年の労働者派遣法改正では、日雇い派遣の原則禁止、同種の業務に従事 する派遣先労働者との労働条件の均衡を図る規定と共に、違法派遣を承知で派遣労働 者を使用した派遣先に直接雇用の申込を行ったものとみなす旨の規定も設けられた。", "平成２４年の労働者派遣法改正では、派遣先都合での派遣契約解除の際、派遣元 が新たな就業機会の確保、休業手当の支払いに要する費用負担などにつき措置を講じ なければならず、なおかつこれらの措置が派遣契約に盛り込まれなければならないと された。", "平成２４年の労働者派遣法改正に際しては、いわゆる常用代替を防ぐため、離職 後１年以内の人物を元の勤務先に派遣することが禁じられた。この規定の趣旨と内容 は、平成２７年改正にも引き継がれた。"], "correctIndex": 0, "explanation": "选①。超过派遣期间限制主要产生雇用申込み义务/行政上的是正措施等，并不意味着法院可以‘强制’让派遣先与劳动者成立雇用合同。"}, {"id": "Wed-06", "source": "Wed", "number": 6, "stem": "平成２７年の労働者派遣法改正に関する記述として適当でないものを１つ選 び、マークせよ。", "options": ["派遣事業の許可基準の１つに、当該派遣元の就業規則等に、雇用契約の無期・有 期を問わず、派遣契約の終了のみをもって派遣労働者を解雇できる旨の定めがないこ とが設けられた。これは、派遣契約と雇用契約の連動的解約を防止する趣旨であり、 必ずしも登録型派遣（一般型派遣）を禁止する趣旨ではない。", "派遣期間に関する制限は、派遣先事業所単位、派遣労働者個人単位を問わず、派 遣元と派遣先の双方に課されることとなった。また、それまで派遣期間の制限のなか った２６業種も、最長３年間の制限の対象とされた。", "派遣先事業所単位での規制として、派遣先の同じ事業所における派遣労働者の受 け入れは最長３年とされ、それを超える場合には、過半数代表等の意見を聴き、意見 があった場合は対応方針等の説明義務が課されることとされた。", "派遣労働者個人単位での規制として、同じ派遣労働者を同じ事業所の同じ組織単 位に３年を超えて派遣することは禁止され、たとえ別の人物に替え、過半数代表等の 意見を聴くなど、派遣先事業所単位の規制を遵守しても、同じ事業所の同じ組織単位 への派遣は認められないこととなった。"], "correctIndex": 3, "explanation": "选④。2015改正后的‘个人单位’限制的是“同一派遣劳动者”在同一组织单位连续超过3年；并不意味着换人后也绝对不能继续向同一组织单位派遣。把个人单位理解成‘组织单位本身永久禁止派遣’是错误的。"}, {"id": "Wed-07", "source": "Wed", "number": 7, "stem": "業務処理請負、職業紹介、出向に関する記述として適当でないものを１つ選 び、マークせよ。", "options": ["業務処理請負では、業者等が発注者から受注した仕事を完成させるため、自ら雇 用する労働者を自ら使用することが原則となるが、注文内容の具体化という形式によ り、実質的に仕事の発注者が受注者の労働者に対して指揮命令するような実態が横行 してきた。合法ではあるため、裁判所がその形式を覆すような判断を示すことはなか った。", "職業紹介は、紹介者が求職者と求人者の間で「あっせん」を行い、両者間の直接 の雇用関係を成立させようとするもので、戦後長らく、原則として国や地方公共団体 が行う無償のサービスに限定されてきたが、民間有料職業紹介が解禁され、平成８年 の職安法施行規則が改正され、ヘッドハンティング報酬に対応する上限緩和が図られ た。", "出向は、一般に、出向元－出向労働者の労働契約と出向先－出向労働者の労働契 約のほか、出向元－出向先の出向契約の３つの契約に基づいて行われるものと解され ている。基本的に民法第６２５条第１項による制約を受けるが、在籍出向で、就業規 則等に根拠規定があり、出向後にも出向元での労働条件が保障されるなどの条件があ れば、その時点での本人の個別同意がなくても、命令を有効とした判例がある。"], "correctIndex": 0, "explanation": "选①。所谓请负/外包如果实质上是发包方直接指挥承包方劳动者，就可能构成‘偽装請負’并被认定为派遣或（旧法下）供给，法院当然会做实质判断，不存在‘形式上叫请负就永远合法’。"}, {"id": "Wed-08", "source": "Wed", "number": 8, "stem": "（８～１０）以下は、松下PDP事件最２小判平成２１年１２月１８日の一部を抜粋ま たは要約したものである。カッコ内に入る最も適当な選択肢を選択せよ。 なお、以下において、Xは１審原告（Yの社外工であり、Yの下請会社であった訴外 C社の元被用者）、Yは１審被告を指す。 「請負人による労働者に対する指揮命令がなく、注文者がその場屋内において労 働者に直接具体的な指揮命令をして作業を行わせているような場合には、たとえ請負 人と注文者との間において請負契約という法形式が採られていたとしても、これを請 負契約と評価することはできない」。 「そして、上記の場合において、注文者と労働者との間に雇用契約が締結されてい ないのであれば、上記3者間の関係は、（回答８）」。", "options": ["労働基準法第６条にいう中間搾取に該当すると解すべきである", "労働者派遣法第２条第１号にいう労働者派遣に該当すると解すべきである", "雇用対策法第２条にいう有料職業紹介に該当すると解すべきである", "職業安定法第４条第６項にいう労働者供給に該当すると解すべきである"], "correctIndex": 1, "explanation": "选②。发包方直接指挥劳动者而劳动者并未与发包方建立雇用关系，典型上会被评价为‘労働者派遣’（派遣元雇用、派遣先指挥）。"}, {"id": "Wed-09", "source": "Wed", "number": 9, "stem": "（８～１０）以下は、松下PDP事件最２小判平成２１年１２月１８日の一部を抜粋ま たは要約したものである。カッコ内に入る最も適当な選択肢を選択せよ。 なお、以下において、Xは１審原告（Yの社外工であり、Yの下請会社であった訴外 C社の元被用者）、Yは１審被告を指す。 本件におけるX-Y社-C社をめぐる事情を総合すると、XY間で直接（有期）雇用 契約が締結される「までの間に（回答９）」。", "options": ["YとXの間に雇用契約関係が黙示に成立していたと考えられる余地がある", "YとXの間に黙示に雇用契約関係が成立していたと考えられる", "CとX間の雇用契約関係は有効に存在していたと解すべきである", "CとY間の業務処理請負契約は無効となっていたものと解すべきである"], "correctIndex": 0, "explanation": "选①。该案中最高裁并不当然承认派遣先与劳动者在此期间“当然成立”默示雇用，最多只能说在个案要素下‘有讨论空间/余地’，因此用“余地がある”更贴近判旨。"}, {"id": "Wed-10", "source": "Wed", "number": 10, "stem": "（８～１０）以下は、松下PDP事件最２小判平成２１年１２月１８日の一部を抜粋ま たは要約したものである。カッコ内に入る最も適当な選択肢を選択せよ。 なお、以下において、Xは１審原告（Yの社外工であり、Yの下請会社であった訴外 C社の元被用者）、Yは１審被告を指す。 (a)直接締結されたXY間の雇用契約は１度も更新されていなかったこと、(b)更 新拒絶の意図が予めX等に伝えられていたこと、を前提にすると、XY間の契約は、 （回答１０）。", "options": ["無期契約へ真正転化したといえ、XのYに対する雇用契約上の地位確認請求が認 められる", "無期契約へ仮性転化したといえ、XのYに対する雇用契約上の地位確認請求が認 められる", "無期契約へ仮性転化したとはいえないが、雇用関係継続の期待は認められるた め、XのYに対する慰謝料請求は認められる", "無期契約へ仮性転化したとはいえず、雇用関係継続の期待も認められないため、 XY間の雇用契約は当該有期契約の期間満了時をもって終了したが、それに至るYの手 法に問題があるので、XのYに対する慰謝料請求は認められる （１１～１２）従来の判例によれば、有期雇用契約が反復継続された場合、反復の回数、 （ア ）、採用時の使用者側の説明内容、（イ ）の有無・方法、同様の条件にあ る労働者の雇止め実績の有無、有期契約者の（ウ ）などの事情から、概ね、（i）無 期限雇用に転化する場合（転化説）、（ii）無期限雇用と同視すべき状態となり、解雇 権濫用規制（or法理）が適用される場合（擬似転化説）、（iii）転化説も擬似転化説も 採り得ないが、従前と同様の有期雇用契約が更新されたのと同様の法律関係になり、雇 止めに解雇権濫用規制が（エ ）される場合（非転化・有期契約更新説）、（iv）転 化説、擬似転化説、非転化・有期契約更新説ともに採り得ないが、契約更新への（オ ） は法的評価に値するので、（オ ）権（or（オ ）的利益）の侵害として、損害賠 償請求権を根拠づける場合（（オ ）権侵害説）、（v）（i）～（iv）のいずれの説 も採り得ない場合、の５種類が想定されて来た。 こうした判例傾向などを踏まえ、平成２４年８月（但し公布日）に（カ ）法 の改正が行われた。"], "correctIndex": 3, "explanation": "选④。题干假设已明确不续约且提前告知，通常难以形成可保护的更新期待→不容易适用雇止め法理；但即便不发生“准契约转化”，雇止め方式若违反信义/损害期待利益，仍可能仅成立慰谢料等损害赔偿。"}, {"id": "Wed-11", "source": "Wed", "number": 11, "stem": "ア～ウ", "options": ["ア 契約書の有無 イ 契約更新手続 ウ 賃金額", "ア 契約継続期間の長さ イ 契約更新手続 ウ 職務内容・職責", "ア 日常の勤務態度・成績 イ 採用試験 ウ 賃金額", "ア 日常の勤務態度・成績 イ 採用試験 ウ 職務内容・職責"], "correctIndex": 1, "explanation": "选②。雇止め是否违法要综合：持续雇用期间长短、更新手续/运用、职务内容与责任等因素；‘契约书有无/工资额’并非核心要素组合。"}, {"id": "Wed-12", "source": "Wed", "number": 12, "stem": "エ～カ", "options": ["エ 類推適用 オ 期待 カ 労働契約", "エ 類推適用 オ 合意 カ 労働契約", "エ 類推適用 オ 合意 カ 労働基準", "エ 拡張適用 オ 合意 カ 労働契約", "エ 拡張適用 オ 期待 カ 労働契約", "エ 拡張適用 オ 期待 カ 労働基準"], "correctIndex": 0, "explanation": "选①。雇止め法理的基本结构是：解雇权滥用法理对雇止め的类推适用；保护的关键是劳动者对更新的“期待”利益；2012年8月改正是把相关规则写入《労働契約法》（18条转换、19条雇止め）。"}, {"id": "Wed-13", "source": "Wed", "number": 13, "stem": "日本ヒルトン事件２審東京高判平成１４年１１月２６日に関する説明として、 適当でないものを１つ選択せよ。 なお、以下において、X は１審原告（Y と日々雇用契約を締結して就労する、常用的 日々雇用労働者）、Y は１審被告を指す。", "options": ["１審・２審共に、Y の経営状態等から、契約更新に際しての労働条件切り下げそ のものには、合理性ありとした。", "１審は、X による切り下げ労働条件下での契約更新について争いつつ、契約更新 自体は行う旨の意思表示（異議留保付き承諾回答）について、民法第５２８条には触 れず、「紛争の解決を裁判所等による判断に委ね、変更後の労働条件に基づく労働契 約の締結申し入れをしていたものというべきであり」、条件変更を争う権利の留保に よる雇止めは許されない、とした。", "２審は、X による切り下げ労働条件下での契約更新について争いつつ、契約更新 自体は行う旨の意思表示（異議留保付き承諾回答）について、民法第５２８条の趣旨 を踏まえ、X らが正社員を志向せず非正規に甘んじて来たことなどを前提に、Y による 契約更新申込みの拒絶である、としたが、長年の契約の継続を理由に、本件雇止めを 権利の濫用で違法とした。 ＜労働時間法＞"], "correctIndex": 2, "explanation": "选③。日本ヒルトン事件（东京高裁）侧重以民法528条等处理“异议留保的承诺”，倾向认为未达成变更合意→不续约并非当然违法；因此把高裁说成‘仍认定雇止め违法/濫用’不符合该判例走向。"}, {"id": "Wed-14", "source": "Wed", "number": 14, "stem": "労基法上の労働時間概念に関する説明として、適当でないものを１つ選択せ よ。", "options": ["労基法上の労働時間の判断規準に関する有力説の中に二要件相補説があり、これ によれば、業務性が強いか、使用者の関与が強い、すなわち、双方の性格をプラスし て１００になるような行動をとっている時間は、同法上の労働時間となるが、いずれ かの性格がゼロである（：全く存しない）場合は除くと解されている。", "会社施設内の歩行時間でも、労基法上の労働時間に当たる場合がある。", "代表的な判例では、作業時間後の洗身は、たとえそのための施設の設置が法令上 義務づけられていても、労基法上の労働時間には該当しないと解されている。", "仮眠時間の労働時間性に関する代表的判例である大星ビル管理事件最１小判平成 １４年２月２８日は、仮眠時間は労基法上の労働時間にはなり得ないと述べた。"], "correctIndex": 3, "explanation": "选④。‘待机/休憩/仮眠’是否属于労働時間关键在于是否处于使用者指挥命令下（拘束性）。判例并不认为仮眠时间“一律不能”成为労働時間。"}, {"id": "Wed-15", "source": "Wed", "number": 15, "stem": "労基法第４１条に関する説明として、適当でないものを１つ選択せよ。", "options": ["本条の適用対象者には労働時間・休日に関する規制は及ばないが、深夜業規制は 及び、使用者は、深夜時間帯に該当者を労働させた場合、法定深夜割増賃金を支払わ ねばならない。高度プロフェッショナル制度の場合は、深夜割増賃金の支払い義務を 負わない。", "第３号（監視断続的労働）のみが、許可制となっている。", "第２号の趣旨について、労基法の起案に関わった寺本廣作氏は、経営上の必要及 び職務の性質に基づく除外であって、管理監督の地位にある者とは、労務管理につい て経営者と一体的立場にある者をいい、労務管理方針の決定に参与することと共に、 自己の勤務についての自由裁量の権限を持つことが重要な基準となる旨を記してい る。", "第２号（管理監督者）に関して、比較的問題の多い業界について、行政の通達が 発出されているが、総じて、判例の立場よりも、若干管理監督者の範囲を厳しく解釈 する傾向にある。"], "correctIndex": 3, "explanation": "选④。管理监督者的范围在判例上通常被严格限定（“名ばかり管理職”多被否定）；说行政通达总体上比判例更严格并不妥当。※管理监督者仍需支付深夜割增；高プロ则连深夜割增也适用除外。"}, {"id": "Wed-16", "source": "Wed", "number": 16, "stem": "労基法上の労働時間規制に関する以下の説明のうち、適当でないものを１つ 選択せよ。", "options": ["労基法上の主要な労働時間規制には、刑法としての側面、行政法としての側面、 契約法としての側面があるが、刑法として活用される場合より契約法として活用され る場合のほうが緩やかに解釈される傾向にある。", "３６協定を締結しないままに、１日１０時間就労させる旨の雇用契約を締結した 場合、労基法第１３条が適用され、後ろの２時間分が無効となり、トータル８時間分 の契約に修正されるとの解釈が通説となっている。", "行政裁判法理では、労働者が、労基法第１０４条に基づき、使用者の労働時間規 制違反を申告した場合にも、監督官が対応するか否かは、原則としてその自由裁量に 委ねられる。", "労基法第３２条は、使用者を名宛人として、一定時間を超えた就労を「させては ならない」と規定しているが、自発的に働く労働者の労働時間の管理責任まで負う趣 旨ではなく、労働者本人の時間配分の問題で長時間労働に及ぶ場合にまで使用者が責 任を負う趣旨でない旨を明示したガイドラインも発出されている。 ＜年次有給休暇＞"], "correctIndex": 3, "explanation": "选④。所谓“自発的残業/自主学习”只要企业事实上允许、知情或应当知情，就可能被计入労働時間，企业仍负有工时管理与（必要时）支付割增等责任；不能因为‘劳动者自己决定’就当然免责任。"}, {"id": "Wed-17", "source": "Wed", "number": 17, "stem": "ILO の条約・勧告に関する説明のうち、適当でないものを１つ選択せよ。", "options": ["ILO の条約・勧告は、取得の権利を得た年次有給休暇は、必ずしもその年度のう ちに取得すべきことを原則とし、数年分の溜め込みや、取得しなかった休暇の買い取 りなどは、その原則に反するとの姿勢を取っている。日本の厚生労働省も少なくとも 法定の年休につき同様の姿勢を示している。", "ILO 第 132 号条約第 13 条は、年休による疲労回復の趣旨や年休自由利用原則に基 づき、労働者が年休取得期間中に他者（：当該雇用者以外）で就業することを加盟国 が禁止することに積極的な立場をとっている。", "ILO の条約・勧告は、年次有給休暇制度に、主として労働力の維持培養と休息権 の保障という２つの趣旨があることを示唆しており、日本の裁判例も総じてその両趣 旨を認めてきた。", "ILO 第 132 号条約は、年休自由利用原則に基づき、本人希望に基づき病気等によ る欠勤を年休扱いとすることにも積極的な立場を採っている。"], "correctIndex": 3, "explanation": "选④。ILO第132号公约的基本思路是让年休用于休养，病假与年休原则上应区分；把“病欠可按劳动者请求计入年休”说成公约的积极立场不当。"}, {"id": "Wed-18", "source": "Wed", "number": 18, "stem": "年次有給休暇に関する説明のうち、適当でないものを１つ選択せよ。", "options": ["会社が就業規則上出勤日とも休業日とも解し得る規定をしつつ、実際上休業日と して取り扱っていた「一般休暇日」が、労基法第３９条第１項所定の全労働日に当た るか否か等が問われた沼津交通事件において、２審東京高判平成２年９月２６日は、 「ある日が労働義務を負う日かどうかを、労基法３９条１項の適用の場面で考える場 合、・・・・・・・その判断は、就業規則ならばその全体的で合理的な解釈により、 職場実態も踏まえて総合的になされるべきである」として、本件における「一般休暇 日」は、「実質上は労働義務を負わない日に当たる」とし、上告審もこれを支持し た。", "林野庁白石営林署事件最２小判昭和４８年３月２日判決は、労基法所定の年休権 が形成権的な権利であることを宣言しつつ、労基法第３９条にいう使用者が年休を 「与える」義務とは、「労働者が有給休暇を享受することを妨げてはならないという 不作為を基本的内容とする義務」であり、時季指定を行わない労働者に対して指定を 促す義務（≠指定を代行する義務）まで含まれないとの趣旨を述べた。", "電電公社横手統制局電話中継所事件最３小判昭和６２年９月２２日判決は、勤務 割制度下で労働者による年休時季指定がなされた場合にも、使用者は、その権利行使 の実現へ向けた積極的な配慮をなす義務を負う旨を判示した。これは、労働者による 時期指定がない場合に積極的に取得を促す趣旨を含む。", "電電公社横手統制局電話中継所事件最３小判昭和６２年９月２２日判決は、現業 公務員が年休権を行使して成田闘争に参加した事案において、原審が採用した「特別 な事情」の論理を採用せず、労基法上の年休制度の原則に則した解釈をとり、１審被 告による当該公務員の懲戒処分を違法無効とした。 ＜労働者の健康と法＞"], "correctIndex": 2, "explanation": "选③。年休的时季指定权以劳动者请求为起点，判例并不一般化要求雇主在未被请求时也要主动“劝导/安排”休假；把义务扩大到此程度不妥。"}, {"id": "Wed-19", "source": "Wed", "number": 19, "stem": "労働者の健康と法に関する説明のうち、適当でないものを１つ選択せよ。", "options": ["従来の判例によれば、本人のパーソナリティ（人格）面の問題や障害が主な要因 となって引き起こされた非違行為（秩序に反する問題行動）を理由とする当該労働者 に対する不利益措置は、合法とされる可能性が高いが、仮に通常の疾病罹患者に求め られる人事管理や健康管理を講じずに疾病（合併症や 2 次障害を含む）を発症・増悪 させれば、使用者の過失責任は認められ得る。", "私傷病の解雇や非自発的な退職措置について、裁判所は、その疾病のゆえに就労 できるか、職場秩序に影響しないかと共に、当該疾病が治り難いか、就労が本人の治 療に影響しないか等を考慮する傾向にある。他方、業務上疾病にり患し、療養中の労 働者については、少なくとも民事上、契約期間が満了したり、定年等で終了しない限 り、労働能力を回復するまで雇用と所得を保障し、ただし、労基法に基づき、3 年経 過後に打切補償を支払うか、被災者が傷病補償年金の受給を開始する等すれば、解雇 を認める場合もある。", "疾病に罹患した労働者が病名を会社に申告しなかった場合でも、使用者がその疾 病への罹患を知るべき事情があれば、原則として健康配慮義務（労働者の健康状態に 応じて就業制限等の配慮を行う義務）を負う。", "労働者が、疾病罹患を秘匿して採用された場合、使用者は、そのことを直接の理 由として当該労働者を解雇する等の不利益な取扱いを講じ得る。 ＜配置転換と出向＞"], "correctIndex": 3, "explanation": "选④。即便劳动者入职时隐瞒病史，也不当然当然构成立即解雇事由；仍要看询问义务、隐瞒的重大性、与劳动能力的关系以及比例原则，并受健康配慮義務等制约。"}, {"id": "Wed-20", "source": "Wed", "number": 20, "stem": "配置転換や出向に関する説明のうち、適当でないものを１つ選択せよ。", "options": ["東亜ペイント事件において、１・２審は、１審被告会社の労働協約や就業規則の 規定に即しつつ、使用者側の配転措置の業務上の必要性と労働者側の配転拒否の正当 事由をほぼ対等に比較衡量する判断基準を採用し、結論的に後者が前者を上回ること を理由に権利濫用に当たると判断し、上告審は、１審被告会社の労働協約や就業規則 が同社に一般的な配転命令権限を定めていたことのほか、１審原告が大卒営業社員で あった事情等を前提に、原則として使用者による業務上の必要性を広く、労働者側の 事由を狭く解する方針を示しつつ、実際の当てはめでも配転命令の有効性を認め、懲 戒解雇処分を合法とした。", "製薬メーカーの MR だった１審原告が、東京営業所から名古屋営業所に転勤を命 じられ、妻及び三人の子供と別居せざるを得なくなったことを違法であるとして、右 転勤命令の無効確認と、単身赴任を強いられたことによる損害賠償を求めた帝国臓器 事件では、下級審は、業務上の必要性に基づくものであって、不当な動機、目的をも ってされたものではなく、１審原告らの被る経済的、社会的、精神的不利益も社会通 念上甘受すべき程度を著しく超えるともいえないとして、請求を棄却したが、上告審 は、使用者には転勤により労働者が受ける不利益の緩和措置を講じる義務があるとの 一般論を述べた。", "新日本製鉄事件最高裁判決では、１審被告会社の就業規則や１審原告らにも適用 される労働協約に、社外勤務を命じる旨の規定があったこと、労働協約である社外勤 務協定に、社外勤務の定義、出向期間、出向中の社員の地位、賃金、退職金、各種の 出向手当、昇格・昇給等の査定その他処遇等に関して出向労働者の利益に配慮した詳 細な規定が設けられている等の事情を認めつつ、たとえ１審被告の従業員としての地 位を維持しながら出向先であるＣ社においてその指揮監督の下での労務提供を命ずる 出向（：在籍出向）命令であっても、民法第６２５条を根拠に、１審被告人は、１審 原告の個別的同意なしに発令することはできないと判示された。"], "correctIndex": 2, "explanation": "选③。企业内出向/转籍是否需个别同意，通常取决于劳动合同/就业规则、必要性与合理性；判例并非一律以民法625条为由要求‘必须个别同意’。"}]</script>

<script>

      correctCount: 0,
      wrongIds: [],
      finished: false
    };
  }

  function pickQuestions() {
    const use = [];
    for (const q of ALL) {
      if (q.source === 'Wed' && !srcWed.checked) continue;
      if (q.source === 'Tue' && !srcTue.checked) continue;
      use.push(q);
    }
    return use;
  }

  function rngShuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildOrder(questions) {
    const ids = questions.map(q => q.id);
    if (shuffle.checked) rngShuffle(ids);
    return ids;
  }

  function getQById(id) {
    return ALL.find(q => q.id === id);
  }

  function render() {
    if (!state.order.length) {
      quizCard.style.display = 'none';
      resultCard.style.display = 'none';
      statusPill.textContent = '未开始';
      return;
    }
    quizCard.style.display = 'block';
    resultCard.style.display = state.finished ? 'block' : 'none';

    const total = state.order.length;
    const qid = state.order[state.index];
    const q = getQById(qid);

    qtitle.textContent = `【${q.source}】第${q.number}题（${qid}）`;
    progress.textContent = `进度：${state.index+1} / ${total}`;
    scoreEl.textContent = `得分：${state.correctCount} / ${Object.keys(state.answered).length}`;

    stemEl.style.display = showJapanese.checked ? 'block' : 'none';
    stemEl.textContent = q.stem;

    optsEl.innerHTML = '';
    submitBtn.disabled = true;
    nextBtn.disabled = true;
    feedback.style.display = 'none';
    feedback.innerHTML = '';

    const chosen = state.answered[qid];
    const already = (chosen !== undefined);

    q.options.forEach((optText, i) => {
      const wrap = document.createElement('label');
      wrap.className = 'opt';

      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'opt';
      radio.value = String(i);
      radio.disabled = already;
      if (already && i === chosen) radio.checked = true;

      radio.addEventListener('change', () => {
        submitBtn.disabled = false;
      });

      const txt = document.createElement('div');
      txt.className = 'txt';
      txt.textContent = `(${i+1}) ${optText}`;

      wrap.appendChild(radio);
      wrap.appendChild(txt);
      optsEl.appendChild(wrap);
    });

    if (already) {
      showFeedback(qid, chosen);
      nextBtn.disabled = false;
      submitBtn.disabled = true;
    }

    statusPill.textContent = state.finished ? '已完成（可回顾错题）' : '进行中';
  }

  function showFeedback(qid, chosenIndex) {
    const q = getQById(qid);
    const correct = q.correctIndex;
    const ok = (chosenIndex === correct);

    feedback.style.display = 'block';
    feedback.innerHTML = '';

    const head = document.createElement('div');
    head.innerHTML = ok
      ? `<span class="ok">✅ 正确</span> 你选了第${chosenIndex+1}项`
      : `<span class="ng">❌ 错误</span> 你选了第${chosenIndex+1}项；正确是第${correct+1}项`;
    feedback.appendChild(head);

    const exp = document.createElement('div');
    exp.className = 'explain';
    exp.textContent = q.explanation;
    feedback.appendChild(exp);

    const labels = optsEl.querySelectorAll('.opt');
    labels.forEach((lab, i) => {
      if (i === correct) {
        lab.style.borderColor = 'rgba(32,201,151,.85)';
        lab.style.background = 'rgba(32,201,151,.08)';
      }
      if (!ok && i === chosenIndex) {
        lab.style.borderColor = 'rgba(255,107,107,.85)';
        lab.style.background = 'rgba(255,107,107,.08)';
      }
    });
  }

  function submitCurrent() {
    const qid = state.order[state.index];
    const q = getQById(qid);

    const sel = document.querySelector('input[name="opt"]:checked');
    if (!sel) return;
    const chosen = parseInt(sel.value, 10);

    state.answered[qid] = chosen;
    const ok = (chosen === q.correctIndex);
    if (ok) state.correctCount += 1;
    else state.wrongIds.push(qid);

    document.querySelectorAll('input[name="opt"]').forEach(r => r.disabled = true);

    showFeedback(qid, chosen);
    submitBtn.disabled = true;
    nextBtn.disabled = false;

    if (Object.keys(state.answered).length === state.order.length) {
      state.finished = true;
      buildResults();
    }

    save();
    render();
  }

  function next() {
    if (state.index < state.order.length - 1) {
      state.index += 1;
      save();
      render();
    } else {
      state.finished = true;
      buildResults();
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function buildResults() {
    const total = state.order.length;
    const answered = Object.keys(state.answered).length;
    const wrong = state.wrongIds.length;
    const correct = state.correctCount;

    resultText.textContent = `已作答：${answered} / ${total}；正确：${correct}；错误：${wrong}。`;

    wrongList.innerHTML = '';
    if (!wrong) {
      const div = document.createElement('div');
      div.className = 'small';
      div.textContent = '没有错题。';
      wrongList.appendChild(div);
      return;
    }

    state.wrongIds.forEach((qid, idx) => {
      const q = getQById(qid);
      const chosen = state.answered[qid];
      const correctIdx = q.correctIndex;

      const det = document.createElement('details');
      const sum = document.createElement('summary');
      sum.textContent = `${idx+1}) 【${q.source}】第${q.number}题（你选${chosen+1}，正确${correctIdx+1}）`;
      det.appendChild(sum);

      const pre = document.createElement('div');
      pre.className = 'stem';
      pre.textContent = q.stem;
      det.appendChild(pre);

      const expl = document.createElement('div');
      expl.className = 'explain';
      expl.textContent = q.explanation;
      det.appendChild(expl);

      const btn = document.createElement('button');
      btn.textContent = '跳到这题';
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        state.index = state.order.indexOf(qid);
        save();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      det.appendChild(btn);

      wrongList.appendChild(det);
    });
  }

  function jumpToNextWrong() {
    const total = state.order.length;
    if (!total) return;

    const currentPos = state.index;

    for (let i = currentPos; i < total; i++) {
      const qid = state.order[i];
      if (state.wrongIds.includes(qid)) {
        state.index = i;
        save();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
    }
    for (let i = 0; i < currentPos; i++) {
      const qid = state.order[i];
      if (state.wrongIds.includes(qid)) {
        state.index = i;
        save();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
    }
    alert('当前没有可跳转的错题（你可能还没做错题，或都做对了）。');
  }

  startBtn.addEventListener('click', () => {
    const picked = pickQuestions();
    if (!picked.length) {
      alert('至少选择一个题目来源（Wed/Tue）。');
      return;
    }
    clearState();
    state.order = buildOrder(picked);
    state.index = 0;
    state.finished = false;
    save();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  submitBtn.addEventListener('click', submitCurrent);
  nextBtn.addEventListener('click', next);

  resetBtn.addEventListener('click', () => {
    if (!confirm('确定清空本地做题记录吗？')) return;
    clearState();
    render();
  });

  reviewBtn.addEventListener('click', () => {
    if (!state.order.length) {
      alert('还没开始。');
      return;
    }
    state.finished = true;
    buildResults();
    save();
    render();
    resultCard.scrollIntoView({ behavior: 'smooth' });
  });

  jumpWrongBtn.addEventListener('click', jumpToNextWrong);

  document.addEventListener('change', (e) => {
    if (e.target && e.target.name === 'opt') submitBtn.disabled = false;
  });

  const has = load();
  if (has && state.order && state.order.length) {
    if (state.finished) buildResults();
    render();
  } else {
    render();
  }
})();
</script>
</main>
</body>
</html>
